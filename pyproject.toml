[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cost-optimizer"
version = "0.1.0"
description = "Read-only scanner that finds common AWS cost waste and estimates monthly savings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[ec2,s3,cloudwatch]>=5", "ruff>=0.6"]

[project.scripts]
cost-optimizer = "cost_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
